{% extends "base.html" %}
{% block title %}Recuperar contraseña | EMEX{% endblock %}

{% block content %}
<section class="auth-shell">
  <div class="auth-card">
    <div class="auth-header">
      <p class="auth-eyebrow">Acceso EMEX</p>
      <h1>Recuperar contraseña</h1>
      <p>Ingresa tu correo y te mostraremos el siguiente paso para recuperar tu acceso.</p>
    </div>

    <form method="post" class="auth-form smart-form">
      <label for="email">Correo</label>
      <input id="email" name="email" type="email" autocomplete="email" required>

      <button class="auth-submit" type="submit">Enviar instrucciones</button>
    </form>

    <p class="auth-switch">
      <a href="{{ url_for('auth.login') }}">Volver al inicio de sesión</a>
    </p>
  </div>
</section>
{% endblock %}
